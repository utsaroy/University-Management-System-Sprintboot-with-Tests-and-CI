<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management System</title>
    <!-- Online Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">

        <!-- Header / Navbar with Role Switcher -->
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h1 class="h4 text-primary mb-1 fw-bold">University Management System</h1>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label for="role-select" class="form-label mb-0 fw-semibold text-nowrap small">Active User:</label>
                    <select id="role-select" class="form-select form-select-sm" style="min-width: 250px;"
                        onchange="changeRole()">
                        <option value="admin:adpass">admin (Role: ADMIN - Full Access)</option>
                        <option value="teacher:teapass">teacher (Role: TEACHER - View & Edit)</option>
                        <option value="student:spass">student (Role: STUDENT - View Only)</option>
                    </select>
                    <button class="btn btn-sm btn-outline-secondary text-nowrap" onclick="loadStudents()">↻
                        Refresh</button>
                </div>
            </div>
        </div>

        <!-- Alert / Notification Box -->
        <div id="alert-box" class="alert d-none mb-4" role="alert"></div>

        <div class="row g-4">
            <!-- Student List Table (Left / Wide Column) -->
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white py-3">
                        <h2 class="h5 mb-0 fw-bold">Students List</h2>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Roll</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Department</th>
                                        <th style="min-width: 140px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="student-tbody">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Loading students...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add / Edit Student Form (Right Column) -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h2 class="h5 mb-0 fw-bold" id="form-title">Add New Student</h2>
                    </div>
                    <div class="card-body">
                        <form id="student-form" onsubmit="handleFormSubmit(event)">
                            <input type="hidden" id="student-id">

                            <div class="mb-3">
                                <label for="roll" class="form-label fw-semibold small">Roll Number</label>
                                <input type="text" class="form-control" id="roll" placeholder="e.g. 2207028" required
                                    minlength="2" maxlength="30">
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold small">Full Name</label>
                                <input type="text" class="form-control" id="name" placeholder="e.g. Alice Johnson"
                                    required minlength="2" maxlength="100">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <input type="email" class="form-control" id="email"
                                    placeholder="e.g. alice@university.edu" required>
                            </div>

                            <div class="mb-3">
                                <label for="department" class="form-label fw-semibold small">Department</label>
                                <input type="text" class="form-control" id="department"
                                    placeholder="e.g. Computer Science" required minlength="2" maxlength="50">
                            </div>

                            <div class="d-flex gap-2 pt-2">
                                <button type="submit" class="btn btn-primary flex-grow-1" id="save-btn">Add
                                    Student</button>
                                <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;"
                                    onclick="resetForm()">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studentsData = [];

        // Helper: Returns HTTP Basic Auth Header
        function getAuthHeader() {
            const credentials = document.getElementById("role-select").value;
            return "Basic " + btoa(credentials);
        }

        // Helper: Show bootstrap alert banner
        function showAlert(message, isError = false) {
            const alertBox = document.getElementById("alert-box");
            alertBox.textContent = message;
            alertBox.className = "alert " + (isError ? "alert-danger" : "alert-success");
            alertBox.classList.remove("d-none");

            setTimeout(() => {
                alertBox.classList.add("d-none");
            }, 5000);
        }

        // Role switcher
        function changeRole() {
            const role = document.getElementById("role-select").selectedOptions[0].text;
            showAlert("Active user switched to: " + role, false);
            loadStudents();
        }

        // 1. Fetch & Display All Students (GET /api/students)
        function loadStudents() {
            fetch("/api/students", {
                headers: {
                    "Authorization": getAuthHeader()
                }
            })
                .then(response => {
                    if (response.status === 401) throw new Error("401 Unauthorized: Invalid credentials.");
                    if (response.status === 403) throw new Error("403 Forbidden: You do not have permission to view students.");
                    if (!response.ok) throw new Error("Failed to load students (Status " + response.status + ")");
                    return response.json();
                })
                .then(students => {
                    studentsData = students;
                    renderTable(students);
                })
                .catch(error => {
                    showAlert(error.message, true);
                    const tbody = document.getElementById("student-tbody");
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${error.message}</td></tr>`;
                });
        }

        // Render Table Rows (Edit & Delete buttons strictly on the same line)
        function renderTable(students) {
            const tbody = document.getElementById("student-tbody");
            tbody.innerHTML = "";

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No students found. Add one on the right!</td></tr>`;
                return;
            }

            students.forEach(student => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                <td class="fw-bold">${escapeHtml(student.roll)}</td>
                <td>${escapeHtml(student.name)}</td>
                <td>${escapeHtml(student.email)}</td>
                <td><span class="badge bg-info text-dark">${escapeHtml(student.department)}</span></td>
                <td>
                    <div class="d-inline-flex gap-2">
                        <button class="btn btn-sm btn-warning" onclick="startEdit(${student.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
                    </div>
                </td>
            `;
                tbody.appendChild(tr);
            });
        }

        // 2. Add (POST) or Update (PUT) Student
        function handleFormSubmit(event) {
            event.preventDefault();

            const id = document.getElementById("student-id").value;
            const payload = {
                roll: document.getElementById("roll").value.trim(),
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                department: document.getElementById("department").value.trim()
            };

            const isUpdating = Boolean(id);
            const url = isUpdating ? `/api/students/${id}` : "/api/students";
            const method = isUpdating ? "PUT" : "POST";

            fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": getAuthHeader()
                },
                body: JSON.stringify(payload)
            })
                .then(response => {
                    if (response.status === 403) {
                        throw new Error(`403 Forbidden: Your current role cannot ${isUpdating ? "update" : "create"} students.`);
                    }
                    if (response.status === 400) {
                        throw new Error("400 Bad Request: Please check your input fields.");
                    }
                    if (!response.ok) {
                        throw new Error(`Operation failed (Status ${response.status})`);
                    }
                    return response.json();
                })
                .then(() => {
                    showAlert(`Student successfully ${isUpdating ? "updated" : "created"}!`, false);
                    resetForm();
                    loadStudents();
                })
                .catch(error => {
                    showAlert(error.message, true);
                });
        }

        // 3. Edit Student
        function startEdit(id) {
            const student = studentsData.find(s => s.id === id);
            if (!student) return;

            document.getElementById("student-id").value = student.id;
            document.getElementById("roll").value = student.roll;
            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("department").value = student.department;

            document.getElementById("form-title").textContent = "Edit Student (ID: " + student.id + ")";
            document.getElementById("save-btn").textContent = "Update Student";
            document.getElementById("cancel-btn").style.display = "inline-block";
        }

        // Reset Form
        function resetForm() {
            document.getElementById("student-form").reset();
            document.getElementById("student-id").value = "";
            document.getElementById("form-title").textContent = "Add New Student";
            document.getElementById("save-btn").textContent = "Add Student";
            document.getElementById("cancel-btn").style.display = "none";
        }

        // 4. Delete Student (DELETE /api/students/{id})
        function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete student with ID: " + id + "?")) {
                return;
            }

            fetch(`/api/students/${id}`, {
                method: "DELETE",
                headers: {
                    "Authorization": getAuthHeader()
                }
            })
                .then(response => {
                    if (response.status === 403) {
                        throw new Error("403 Forbidden: Only ADMIN role can delete students.");
                    }
                    if (!response.ok && response.status !== 204) {
                        throw new Error(`Failed to delete student (Status ${response.status})`);
                    }
                    showAlert("Student deleted successfully!", false);
                    loadStudents();
                })
                .catch(error => {
                    showAlert(error.message, true);
                });
        }

        // Escape HTML Helper
        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load on page startup
        window.addEventListener("DOMContentLoaded", loadStudents);
    </script>

</body>

</html>
